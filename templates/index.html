<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Text Summarizer</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <style>
    body {
      font-family: 'Inter', sans-serif;
      background: linear-gradient(to right, #e3f2fd, #ffffff);
      padding: 0;
      margin: 0;
      color: #333;
    }

    .container {
      max-width: 800px;
      margin: 60px auto;
      padding: 40px;
      background-color: #ffffff;
      border-radius: 16px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.1);
    }

    header {
      text-align: center;
      margin-bottom: 30px;
    }

    header h1 {
      font-size: 2.4rem;
      margin-bottom: 8px;
    }

    textarea {
      width: 100%;
      padding: 15px;
      font-size: 16px;
      border-radius: 10px;
      border: 1px solid #ccc;
      margin-bottom: 20px;
      resize: vertical;
    }

    button {
      padding: 10px 20px;
      font-size: 16px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      margin-right: 10px;
      transition: background 0.3s ease;
    }

    #submitBtn {
      background-color: #1976d2;
      color: white;
    }

    #playBtn {
      background-color: #43a047;
      color: white;
    }

    #stopBtn {
      background-color: #e53935;
      color: white;
    }

    .result {
      display: none;
      margin-top: 30px;
      padding: 20px;
      background-color: #f5f5f5;
      border-radius: 10px;
    }

    .word-count {
      margin-top: 15px;
      font-size: 15px;
    }

    .word-count span {
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>✨NLP Text Summarizer</h1>
      <p>Paste your content and get a summary with a click.</p>
    </header>

    <form id="summarizeForm">
      <textarea id="input_text" name="input_text" rows="8" placeholder="Paste your text here..."></textarea>
      <br>
      <button type="submit" id="submitBtn">Summarize</button>
    </form>

    <div id="result" class="result">
      <h3>Summary:</h3>
      <p id="summaryText"></p>

      <div class="word-count">
        📝 Original Text: <span id="originalCount"></span> words<br>
        ✂️ Summary: <span id="summaryCount"></span> words
      </div>

      <div style="margin-top: 15px;">
        <button id="playBtn">🔊 Play</button>
        <button id="stopBtn">⏹️ Stop</button>
      </div>
    </div>
  </div>

  <script>
    let utterance;

    $(document).ready(function () {
      $("#summarizeForm").submit(function (e) {
        e.preventDefault();
        const inputText = $("#input_text").val();

        $.ajax({
          url: "/",
          method: "POST",
          contentType: "application/json",
          data: JSON.stringify({ input_text: inputText }),
          success: function (response) {
            $("#summaryText").text(response.summary);
            $("#originalCount").text(response.original_word_count);
            $("#summaryCount").text(response.summary_word_count);
            $("#result").fadeIn();
            speechSynthesis.cancel();  // stop any previous speech
          },
          error: function () {
            alert("Error occurred while summarizing.");
          }
        });
      });

      $("#playBtn").click(function () {
        const text = $("#summaryText").text();
        if (!text) return;

        speechSynthesis.cancel();
        utterance = new SpeechSynthesisUtterance(text);
        utterance.rate = 1;
        utterance.pitch = 1;
        speechSynthesis.speak(utterance);
      });

      $("#stopBtn").click(function () {
        speechSynthesis.cancel();
      });
    });
  </script>
</body>
</html>
